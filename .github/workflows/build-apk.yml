name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: spotify-clone/package-lock.json

    - name: Install Dependencies
      working-directory: ./spotify-clone
      run: npm install

    - name: Build Next.js Static Export
      working-directory: ./spotify-clone
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Add Capacitor Android Platform
      working-directory: ./spotify-clone
      run: npx --yes @capacitor/cli add android --no-sync

    - name: Sync Capacitor Android
      working-directory: ./spotify-clone
      run: npx --yes @capacitor/cli sync android

    - name: Grant execute permission for Gradle
      working-directory: ./spotify-clone
      run: chmod +x android/gradlew

    - name: Build Debug APK with Gradle
      working-directory: ./spotify-clone/android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: audionix-debug-apk
        path: spotify-clone/android/app/build/outputs/apk/debug/app-debug.apk